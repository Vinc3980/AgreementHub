<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password · AgreementHub</title>
<meta name="description" content="Request a password reset link for your AgreementHub account." />
<meta name="theme-color" content="#F3EFE6" />
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/auth.css" />
</head>
<body>
  <header class="auth-header">
    <div class="auth-wrap">
      <a class="auth-brand" href="../" aria-label="AgreementHub home">
        <img src="../assets/icon.svg" alt="" /> AgreementHub
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-col">
      <a class="auth-back" href="../">← Back to overview</a>
      <div class="auth-card">
        <p class="caps">The instrument</p>
        <h1>Reset your password</h1>
        <p class="sub">We’ll send a reset link to the email on your account.</p>

        <form class="auth-form" id="auth-form" novalidate data-notice="This public preview is not connected to a live workspace. Password reset is available in the full AgreementHub application.">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
          </div>
          <button class="btn btn-full" type="submit">Send reset link</button>
        </form>

        <div class="notice" id="notice" role="status" tabindex="-1" hidden></div>
      </div>

      <p class="auth-below">Remembered it? <a href="../login/">Sign in</a></p>
    </div>
  </main>

  <footer class="auth-foot">
    <div class="auth-wrap">
      <span>Hash-sealed records · append-only audit trail</span>
      <a href="../#verify">Public verification</a>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('auth-form');
      var notice = document.getElementById('notice');
      var email = document.getElementById('email');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!email.value.trim() || !email.checkValidity()) { email.reportValidity(); return; }
        notice.textContent = form.getAttribute('data-notice');
        notice.hidden = false;
        notice.focus();
      });
    })();
  </script>
</body>
</html>
